name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://growthbridge.org
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      NEXT_PUBLIC_SITE_NAME: Growthbridge Virtual Organization
      NEXT_PUBLIC_CONTACT_EMAIL: hello@growthbridge.org
      NEXT_PUBLIC_AUTONOMOUS_PLATFORM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Install exactly the dependency graph captured by package-lock.json.
      - id: install
        run: npm ci --no-audit --no-fund
      - id: typecheck
        name: Run typecheck and capture diagnostics
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          result=${PIPESTATUS[0]}
          exit "$result"
      - if: always() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
      - if: always() && steps.install.outcome == 'success'
        run: npm run lint
      - if: always() && steps.install.outcome == 'success'
        run: npm test
      - if: always() && steps.install.outcome == 'success'
        run: npm run build

      - if: always() && steps.install.outcome == 'success'
        name: Check accessible color contrast
        run: npm run contrast:check
      - if: always() && steps.install.outcome == 'success'
        name: Check security migration invariants
        run: npm run security:check
      - if: always() && steps.install.outcome == 'success'
        name: Check production readiness
        run: npm run production:check

      - if: always() && steps.install.outcome == 'success'
        name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - if: always() && steps.install.outcome == 'success'
        name: Run browser end-to-end tests
        run: npm run test:e2e
      - if: always() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
