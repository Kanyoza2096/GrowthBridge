name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://growthbridge.org
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_SITE_NAME: Growthbridge Virtual Organization
      NEXT_PUBLIC_CONTACT_EMAIL: hello@growthbridge.org
      NEXT_PUBLIC_AUTONOMOUS_PLATFORM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The repository currently has no committed lockfile. Switch this to
      # `npm ci` immediately after package-lock.json is generated and committed.
      - id: install
        run: npm install --no-audit --no-fund
      - id: typecheck
        name: Run typecheck and capture diagnostics
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          result=${PIPESTATUS[0]}
          exit "$result"
      - if: always() && steps.install.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: ignore
      - if: always() && steps.install.outcome == 'success'
        run: npm run lint
      - if: always() && steps.install.outcome == 'success'
        run: npm test
      - if: always() && steps.install.outcome == 'success'
        run: npm run build
