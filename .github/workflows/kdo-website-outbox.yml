name: KDO Website Event Outbox
# A workflow-file push also provides an immediate, auditable dispatch trigger.
# Operational note: this revision re-triggers delivery after the KDO receiver became ready.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kdo-website-outbox.yml'

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch pending KDO website events
        env:
          DISPATCH_URL: ${{ vars.GROWTHBRIDGE_KDO_DISPATCH_URL }}
          DISPATCH_SECRET: ${{ secrets.KDO_WEBSITE_DISPATCH_SECRET }}
        run: |
          if [ -z "$DISPATCH_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo "KDO outbox dispatcher is not configured; skipping safely."
            exit 0
          fi
          case "$DISPATCH_URL" in
            https://*) ;;
            *) echo "Dispatcher URL must use HTTPS."; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 50 \
            --request POST \
            --header "Authorization: Bearer $DISPATCH_SECRET" \
            --write-out '\nHTTP_STATUS=%{http_code}\n' \
            "$DISPATCH_URL"
      - name: Dispatch pending GrowthBridge agent jobs
        if: always()
        env:
          DISPATCH_URL: ${{ vars.GROWTHBRIDGE_KDO_DISPATCH_URL }}
          DISPATCH_SECRET: ${{ secrets.KDO_WEBSITE_DISPATCH_SECRET }}
        run: |
          if [ -z "$DISPATCH_URL" ] || [ -z "$DISPATCH_SECRET" ]; then
            echo "GrowthBridge agent dispatcher is not configured; skipping safely."
            exit 0
          fi
          case "$DISPATCH_URL" in
            https://*) ;;
            *) echo "Dispatcher URL must use HTTPS."; exit 1 ;;
          esac
          case "$DISPATCH_URL" in
            */api/kdo/events/dispatch) ;;
            *) echo "The configured KDO dispatcher URL has an unexpected path."; exit 1 ;;
          esac
          AGENT_URL="${DISPATCH_URL%/api/kdo/events/dispatch}/api/growthbridge-agent/dispatch"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --request POST \
            --header "Authorization: Bearer $DISPATCH_SECRET" \
            --header "Accept: application/json" \
            "$AGENT_URL"
