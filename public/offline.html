<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b35">
    <title>You're offline | Growthbridge</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f8f6; color: #18332f; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); text-align: center; padding: 36px 28px; border-radius: 24px; background: white; box-shadow: 0 16px 48px rgb(18 59 53 / 10%); }
      h1 { margin: 0 0 12px; font-size: 1.8rem; }
      p { line-height: 1.65; color: #52645f; }
      a { display: inline-block; margin-top: 12px; padding: 12px 20px; border-radius: 999px; background: #123b35; color: white; text-decoration: none; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Growthbridge needs an internet connection to load this page. Your account and private information are not stored for offline use.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
