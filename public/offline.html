<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <title>You're offline | GrowthBridge</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f8fafc; color: #152536; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); padding: 40px; border: 1px solid #dce5ec; border-radius: 24px; background: white; box-shadow: 0 20px 60px #123b5d12; }
    .mark { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: #123b5d; color: white; font-weight: 800; letter-spacing: -.08em; font-size: 21px; }
    h1 { margin: 28px 0 12px; font-size: clamp(1.8rem, 6vw, 2.5rem); letter-spacing: -.04em; }
    p { color: #526477; line-height: 1.7; }
    button { margin-top: 16px; border: 0; border-radius: 999px; padding: 13px 20px; background: #123b5d; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid #70b7e5; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">GB</div>
    <h1>You're temporarily offline.</h1>
    <p>GrowthBridge needs an internet connection to load this page. Check your connection and try again. Your private account and admin information are never stored for offline access.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
